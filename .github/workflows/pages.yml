name: Publish to GitHub Pages
# Builds the app (pulling fresh Scryfall data) and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://sleyh.github.io/hobbit-vault/
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: pages
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build -- --base /hobbit-vault/
      - name: Push to gh-pages
        run: |
          cd dist && cp index.html 404.html && touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" gh-pages
